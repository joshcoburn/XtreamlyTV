name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        if: matrix.language == 'java-kotlin'
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java-kotlin'
        with:
          validate-wrappers: true
      - uses: android-actions/setup-android@v4
        if: matrix.language == 'java-kotlin'
      - name: Install Android SDK
        if: matrix.language == 'java-kotlin'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-android-toolchain.mjs
          node scripts/generate-tokens.mjs
          mkdir -p dist/ci
          cd apps/android-tv
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../../dist/ci/codeql-android-build.log
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.language == 'java-kotlin'
        with:
          name: xtreamlytv-codeql-android-build-log
          path: dist/ci/codeql-android-build.log
          if-no-files-found: ignore
      - uses: github/codeql-action/analyze@v4
