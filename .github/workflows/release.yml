name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - uses: android-actions/setup-android@v4
      - name: Install tools
        run: |
          npm install -g @webos-tools/cli
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Prepare and test shared/webOS code
        run: |
          npm run prepare:apps
          npm run check:versions
          npm run check:android-toolchain
          npm run check:webos
          npm run check:bridge
          npm run test:bridge
          npm run test:core
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run production webOS browser tests
        run: |
          python -m pip install -r apps/webos/tests/requirements.txt
          python -m playwright install --with-deps chromium
          npm run test:webos
      - name: Build webOS
        run: npm run build:webos
      - name: Build Android TV debug artifact
        working-directory: apps/android-tv
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../dist/ci
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee ../../dist/ci/android-release-build.log
      - name: Checksums
        run: |
          mkdir -p dist/release
          cp dist/webos/*.ipk dist/release/
          cp apps/android-tv/app/build/outputs/apk/debug/app-debug.apk dist/release/XtreamlyTV-AndroidTV-debug.apk
          cd dist/release
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: xtreamlytv-release-build-log
          path: dist/ci/android-release-build.log
          if-no-files-found: ignore
      - name: Select versioned release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release-notes/${version}.md"
          test -f "$notes"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/release/*
